<header class="topbar">
  <div class="topbar__inner container">
    <a class="brand" routerLink="/">
      <span class="brand__logo" aria-hidden="true">RW</span>
      <span class="brand__name">Market</span>
    </a>

    <span class="status status--{{ status() }}" role="status">
      <span class="status__dot" aria-hidden="true"></span>
      <span class="status__label">{{ statusLabel() }}</span>
    </span>
  </div>
</header>

<main class="container">
  <router-outlet />
</main>

<footer class="footer container">
  資料來源：Binance Public API（REST + WebSocket），僅供展示，不構成投資建議。
</footer>
