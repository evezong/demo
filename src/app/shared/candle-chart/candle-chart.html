@if (active(); as a) {
  <dl class="legend" [class.legend--up]="a.candle.rising" [class.legend--down]="!a.candle.rising">
    <div class="legend__time">{{ a.kline.openTime | date: 'MM/dd HH:mm' }}</div>
    <div><dt>開</dt><dd>{{ a.kline.open | price }}</dd></div>
    <div><dt>高</dt><dd>{{ a.kline.high | price }}</dd></div>
    <div><dt>低</dt><dd>{{ a.kline.low | price }}</dd></div>
    <div><dt>收</dt><dd>{{ a.kline.close | price }}</dd></div>
  </dl>
}

<div class="plot">
  <svg
    [attr.viewBox]="'0 0 ' + width + ' ' + height"
    preserveAspectRatio="none"
    role="img"
    aria-label="K 線圖"
    (pointermove)="onPointerMove($event)"
    (pointerdown)="onPointerMove($event)"
    (pointerleave)="onPointerLeave()"
  >
    @for (g of geometry().gridLines; track $index) {
      <line class="grid" x1="0" [attr.x2]="width" [attr.y1]="g.y" [attr.y2]="g.y" />
    }

    @if (active(); as a) {
      @if (a.hovering) {
        <line class="crosshair" [attr.x1]="a.candle.x" [attr.x2]="a.candle.x" y1="0" [attr.y2]="height" />
      }
    }

    @for (c of geometry().candles; track $index) {
      <g [class]="c.rising ? 'candle up' : 'candle down'">
        <line [attr.x1]="c.x" [attr.x2]="c.x" [attr.y1]="c.wickTop" [attr.y2]="c.wickBottom" />
        <rect [attr.x]="c.bodyX" [attr.y]="c.bodyY" [attr.width]="c.bodyWidth" [attr.height]="c.bodyHeight" />
      </g>
    }
  </svg>

  <ul class="axis" aria-hidden="true">
    @for (g of geometry().gridLines; track $index) {
      <li [style.top.%]="(g.y / height) * 100">{{ g.price | price }}</li>
    }
  </ul>
</div>
